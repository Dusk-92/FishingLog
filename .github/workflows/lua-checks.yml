name: Lua checks

on:
  push:
  pull_request:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: find Dusk -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Run pure-Lua regression tests
        run: lua5.1 tests/test_fl_number.lua
