name: Lua checks

on:
  push:
  pull_request:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Persistence isolation guards
        run: |
          grep -F '<Configuration Apartment="FishingLog"/>' Dusk/FishingLog.plugin
          grep -F 'function FL_PluginDataLoad' Dusk/FishingLog/FL_Preflight.lua
          grep -F 'function FL_PluginDataSave' Dusk/FishingLog/FL_Preflight.lua
          grep -F 'PluginDataLoadChecked' Dusk/Common/__init__.lua
          ! grep -F 'function Turbine.PluginData.Load' Dusk/Common/__init__.lua
          ! grep -F 'function Turbine.PluginData.Save' Dusk/Common/__init__.lua
          ! grep -F 'Turbine.PluginData.Load(' Dusk/FishingLog/FL_Main.lua
          ! grep -F 'Turbine.PluginData.Save(' Dusk/FishingLog/FL_Main.lua
          ! grep -F 'Turbine.PluginData.Load =' Dusk/FishingLog/FL_Loader.lua
          grep -F 'FL_ParseFishingAdvancement' Dusk/FishingLog/FL_Main.lua
          grep -F 'FL_ExtractIIDDID' Dusk/FishingLog/FL_Main.lua
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: find Dusk -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Run pure-Lua regression tests
        run: |
          for test in tests/test_fl_*.lua; do
            echo "Running $test"
            lua5.1 "$test"
          done
