name: "FR8.4 one-shot patch"

on:
  push:
    branches:
      - "feat/fr8-4-fishing-level"
    paths:
      - ".github/workflows/fr8-4-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/fr8-4-fishing-level"
      - name: Apply FR8.4 patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fr8_4_patch.py
          python3 /tmp/fr8_4_patch.py
          git config user.name "Dusk-92"
          git config user.email "romain.thomas92@proton.me"
          git add -A
          git commit -m "FishingLog FR8.4 — show fishing level in window"
          git push origin HEAD:feat/fr8-4-fishing-level
