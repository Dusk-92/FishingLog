name: FR8.3 one-shot patch

on:
  push:
    branches:
      - fix/fr8-3-rod-category
    paths:
      - .github/workflows/fr8-3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fr8-3-rod-category

      - name: Apply FR8.3 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          replace(
              'Dusk/FishingLog/FL_Preflight.lua',
              '-- FishingLog FR8.1 final release preflight.',
              '-- FishingLog FR8.3 release preflight.'
          )
          replace(
              'Dusk/FishingLog/FL_Preflight.lua',
              'table.insert(history.entries,{version="FR8.1",data=payload})',
              'table.insert(history.entries,{version="FR8.3",data=payload})'
          )
          replace(
              'Dusk/FishingLog/FL_Preflight.lua',
              '        local expectedCategory=(field=="rod" and not bypass) and 104 or nil',
              '        -- FR8.3: numeric LOTRO item-category IDs are not stable enough to validate rods.\n        -- Keep the real Quickslot/Item validation, but never reject a rod by category number.\n        local expectedCategory=nil'
          )

          replace(
              'Dusk/FishingLog/FL_Window.lua',
              'Totals.rod = FL_Shortcut(sender,FL_Lang=="FR" and "Canne à pêche" or "Fishing rod",nil,FishingPole)',
              'Totals.rod = FL_Shortcut(sender,FL_Lang=="FR" and "Canne à pêche" or "Fishing rod",nil,nil)'
          )

          old_loader = '''-- Revalidate a rod restored from an old save. Do not clear it if LOTRO cannot
-- resolve the item yet; only reject a resolved item whose category is wrong.
if Totals and Totals.rod and FL_window and FL_window.rod then
    local shortcut = FL_window.rod:GetShortcut()
    local item = shortcut and shortcut:GetItem()
    local info = item and item:GetItemInfo()
    if info and info:GetCategory()~=FishingPole then
        Totals.rod = nil
        FL_window.rod:SetShortcut(Turbine.UI.Lotro.Shortcut())
        FL_window.rod:SetBackground("Dusk/FishingLog/Rod.tga")
        printe(FL_Lang=="FR" and "L’ancienne canne enregistrée n’était pas valide et a été retirée." or "The saved fishing rod was invalid and has been cleared.")
    end
end
'''
          new_loader = '''-- FR8.3: do not revalidate fishing rods through a numeric item-category ID.
-- LOTRO can return a different category for valid rods (including the basic rod).
-- Shortcut validity is already handled safely by the preflight Quickslot test.
'''
          replace('Dusk/FishingLog/FL_Loader.lua', old_loader, new_loader)

          replace(
              'Dusk/FishingLog/FL_Data.lua',
              'FishingPole = 104 -- item category',
              'FishingPole = 104 -- legacy category value; no longer used to validate fishing rods'
          )

          replace(
              'Dusk/FishingLog.plugin',
              '<Version>1.3-FR8.2</Version>',
              '<Version>1.3-FR8.3</Version>'
          )
          replace(
              'Dusk/FishingLog.plugin',
              '<Description>FR8.2 : icône sur la couche UI normale, la carte et les panneaux LOTRO passent devant.</Description>',
              '<Description>FR8.3 : les cannes valides ne sont plus rejetées par une catégorie LOTRO numérique obsolète.</Description>'
          )

          replace(
              'README.md',
              'Version actuelle : **1.3-FR8.2**.',
              'Version actuelle : **1.3-FR8.3**.'
          )
          replace(
              'README.md',
              '- **FR8.2** : l’icône flottante utilise la couche UI normale (`ZOrder 0`) comme TravelRef et LOTRO Events, afin que la carte et les panneaux natifs LOTRO puissent passer devant.',
              '- **FR8.2** : l’icône flottante utilise la couche UI normale (`ZOrder 0`) comme TravelRef et LOTRO Events, afin que la carte et les panneaux natifs LOTRO puissent passer devant ;\n- **FR8.3** : suppression de la validation des cannes par l’ancienne catégorie numérique `104` ; la validation sûre du raccourci `Item` reste active.'
          )
          replace(
              'README.md',
              'La FR8.2 n’ajoute donc pas de filtre spéculatif',
              'La FR8.3 n’ajoute donc pas de filtre spéculatif'
          )

          Path('Dusk/FishingLog/README_FR8_3.txt').write_text('''FishingLog 1.3-FR8.3 — validation des cannes\n\nCorrection\n- Suppression de la validation d’une canne via la catégorie numérique LOTRO `104`.\n- La « Canne à pêche de base » et les autres cannes valides ne sont plus rejetées uniquement parce que l’API retourne une autre catégorie.\n- Le préflight continue de vérifier que la donnée sauvegardée est un vrai raccourci LOTRO de type Item et conserve le système pending si l’objet n’est pas résolu.\n- L’ancien contrôle de catégorie du loader est retiré.\n\nPortée\n- Aucun changement du comptage des prises, des lieux, du chat ou de l’icône FR8.2.\n''', encoding='utf-8')

          Path('.github/workflows/fr8-3-patch.yml').unlink()
          PY

          git config user.name "Dusk-92"
          git config user.email "romain.thomas92@proton.me"
          git add -A
          git commit -m "FishingLog FR8.3 — accept valid LOTRO fishing rods"
          git push origin HEAD:fix/fr8-3-rod-category
